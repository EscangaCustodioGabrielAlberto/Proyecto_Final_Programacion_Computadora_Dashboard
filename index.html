<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header class="header">
        <img src="img/logo_yoshi.webp" height="80">
        <h1>Yoshi's Task Island </h1>
    </header>
    <main class="container">

        <section class="task-form">
            <input id="taskInput" type="text" placeholder="Nueva tarea">
            <label>Prioridad:</label>
            <select id="prioritySelect">
                <option value="Baja">Baja</option>
                <option value="Media">Media</option>
                <option value="Alta">Alta</option>
            </select>
            <button id="addTaskBtn">Agregar</button>
            <br>
            <button id="completeAllBtn">Completar Todas Las Tareas ✅✅</button>
            <button id="deleteAllBtn">Eliminar Todas Las Tareas 🗑️🗑️</button>
            <button id="deleteCompletedBtn">Eliminar Solo Las Tareas Completadas 🗑️✅</button>
            <button id="dismarkAllBtn">Desmarcar Todas las Tareas 🚫✅</button>
        </section>

        <!-- El Contador de tareas-->
         <section class="task-stats">
            <img src="img/yoshi_corriendo.gif" height="80">
            <p>🌐Total: <span id="totalTasks"> 0 </span></p>
            <p>✔️Completadas: <span id="completedTasks"> 0 </span> </p>
            <p>⏳Pendientes: <span id="pendingTasks"> 0 </span></p>
            <p>📈Progreso: <span id="progress"> 0% </span></p>
         </section>

         <section class="task-sort">
            <button id="sortAZ">Ordenar de A -> Z</button>
            <button id="sortZA">Ordenar de Z -> A</button>
            <button id="sortPriority">Ordenar por prioridad</button>
         </section>

        <section id="taskList" class="task-list">
            <!--<div class="task-item">
                <div class="task-left">
                    <input type="checkbox">
                    <span>Estudiar Javascript</span>
                </div>
                <button class="delete-btn">Eliminar</button>
            </div>-->
        </section>

    </main>
    <!-- NUEVO EN ESTA CLASE -->
    <!-- Conexión con el archivo JavaScript -->
    <script src="js/script.js"></script>

</body>
</html>
