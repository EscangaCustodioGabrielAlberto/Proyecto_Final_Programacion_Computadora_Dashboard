<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <title>Dashboard</title>
</head>
<body>
    <header class="header">
        <h1>Dashboard de Tareas</h1>
    </header>

    <main class="container">
        <section class="task-form">
            <input id="taskInput" type="text" placeholder="Nueva Tarea">
            <button id="addTaskBtn">Agregar</button>
        </section>

        <section class="task-stats">
            <p>Total: <span id="totalTask"> 0 </span></p>
            <p>Completadas: <span id="completedTask"> 0 </span></p>
            <p>Pendientes: <span id="pendingTask"> 0 </span></p>
        </section>

        <section id="taskList" class="task-list">
            <div class="task-item">
                <div class="task-left">
                    <input type="checkbox">
                    <span>Estudiar JavaScript</span>
                </div>
                <button class="delete-btn">Eliminar</button>
            </div>

        </section>
    </main>
    <script src="js/script.js"></script>

</body>
</html>
