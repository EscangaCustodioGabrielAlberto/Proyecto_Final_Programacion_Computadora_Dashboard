<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <title>Dashboard</title>
</head>
<body>
    <header class="header">
        <h1>Dashboard de Tareas</h1>
    </header>

    <main class="container">
        <section class="task-form">
            <input id="taskInput" type="text" placeholder="Nueva Tarea">
            <button id="addTaskBtn">Agregar</button>
        </section>

        <section id="taskList" class="task-list">
            <div class="task-item">
                <span>Estudiar CSS </span>
                <input type="checkbox" id="checkBtn" class="complete-btn">
            </div>

            <div class="task-item">
                <span>Hacer ejercicio </span>
                <input type="checkbox" id="checkBtn" class="complete-btn">
                
            </div>
        </section>
    </main>
    <script src="js/script.js"></script>

</body>
</html>
